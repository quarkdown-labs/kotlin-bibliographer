name: Release

on:
  push:
    tags: [v*]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to Maven Central
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full tag history, required by replace-version-in-files to determine the previous release version.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hayagriva-wasm

      - name: Regenerate hayagriva binding
        run: ./hayagriva-wasm/regenerate.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bumps version.txt, turns the changelog's [Unreleased] section into a dated
      # release section, commits both to main, and publishes the GitHub release
      # with the extracted notes.
      - name: Release
        uses: iamgio/simple-release@v1
        with:
          version-file: version.txt
          changelog-file: CHANGELOG.md
          replace-version-in-files: README.md
          commit: 'true'

      # Packs the regenerated binding as an npm tarball and uploads it to the release.
      - name: Attach hayagriva binding to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src/wasmJsMain/npm/hayagriva-wasm/package.json | head -n1)"
          asset="hayagriva-wasm-$version.tgz"
          npm pack ./src/wasmJsMain/npm/hayagriva-wasm
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          echo "HAYAGRIVA_WASM_TARBALL_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" >> "$GITHUB_ENV"

      # Publishes the version now recorded in version.txt.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          ./gradlew --no-daemon publishAndReleaseToMavenCentral
          -PhayagrivaWasmFromRelease=true
          -PhayagrivaWasmTarballUrl="$HAYAGRIVA_WASM_TARBALL_URL"
          --stacktrace
